id = "t02_won_deal_text"
tier = 1
surface = "pipeline"
title = "Text the owner when a deal is won"
prompt = """
Create an automation on the `eval_deals` pipeline named "{p} Won Deal Text" with api_name `{p}_won_deal_text`.

When a deal moves into the stage "Closed Won" from any other stage, send a text message to the deal's owner (the team member who owns the record) that says "Deal won: " followed by the deal's name (filled in from the record when the text is sent).
"""

[covers]
triggers = ["stage_updated"]
steps = ["notify_member_via_text"]

[[expect]]
api_name = "{p}_won_deal_text"
type = "record_based"
target_object = "eval_deals"
active = false
triggers = ["stage_updated"]
steps = { notify_member_via_text = 1 }
checks = [
  { kind = "trigger_block", trigger = "stage_updated", match = { to_stage = "*" } },
  { kind = "mentions", step = "notify_member_via_text", text = "entity_record.name" },
]

[[rubric]]
id = "stage_closed_won"
text = '''The trigger fires on a move into the stage "Closed Won", from any stage.'''

[[rubric]]
id = "texts_the_owner"
text = '''The text goes to the record's owner, not to a fixed person or a role.'''

[[rubric]]
id = "text_content"
text = '''The text reads "Deal won: " followed by a merge field that resolves to the deal's name when sent, not a literal name and not an empty or unsupported token.'''
