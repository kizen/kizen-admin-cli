id = "t09_webhook_retry"
tier = 2
surface = "custom_object"
title = "Webhook trigger, a counter variable, and a go-to retry"
prompt = """
Create an automation on the `eval_accounts` object named "{p} Webhook Retry" with api_name `{p}_webhook_retry`.

It is started by a webhook named `{p}_retry` that accepts any request (no authentication).

It uses two automation variables: a number variable `attempts` and a string variable `last_status`.

Steps, in order:

1. Wait 1 hour.
2. With a math step, add 1 to `attempts` and store the result back in `attempts`.
3. Check whether the variable `attempts` is 3 or more.
   - If yes: stop the run and mark it as Failed.
   - If no: set the variable `last_status` to the text "retrying", then jump back to the 1-hour wait in step 1.
"""

[covers]
triggers = ["webhook"]
steps = ["initialize_variable", "delay", "math_operator", "condition", "stop_execution", "update_variable", "go_to_automation_step"]
features = ["branching", "variables", "goto"]

[[expect]]
api_name = "{p}_webhook_retry"
type = "record_based"
target_object = "eval_accounts"
active = false
triggers = ["webhook"]
steps = { initialize_variable = 2, delay = 1, math_operator = 1, condition = 1, stop_execution = 1, update_variable = 1, go_to_automation_step = 1 }
checks = [
  { kind = "trigger_block", trigger = "webhook", match = { auth_type = "none" } },
  { kind = "block", step = "delay", match = { hours = 1 } },
  { kind = "branch", of = "condition", yes = ["stop_execution"], no = ["update_variable", "go_to_automation_step"] },
  { kind = "block", step = "stop_execution", match = { action = "stop_and_fail" } },
  { kind = "goto", target = "delay" },
]

[[rubric]]
id = "webhook"
text = '''The webhook trigger is named with the run's prefix followed by "_retry" and requires no authentication.'''

[[rubric]]
id = "variables"
text = '''There is a number variable attempts and a text variable last_status.'''

[[rubric]]
id = "math"
text = '''The math step adds 1 to attempts and stores the result in attempts.'''

[[rubric]]
id = "condition"
text = '''The condition tests the variable attempts for 3 or more.'''

[[rubric]]
id = "yes_fails"
text = '''The yes branch stops the run and marks it Failed.'''

[[rubric]]
id = "no_loops_back"
text = '''The no branch sets last_status to "retrying" and then jumps back to the 1-hour wait.'''
