id = "t30_goal_stage_wait"
tier = 2
surface = "pipeline"
title = "A goal with no time limit, and an activity due relative to a date field"
prompt = """
Create an automation on the `eval_deals` pipeline named "{p} Won Follow Up" with api_name `{p}_won_follow_up`.

It runs when an "Eval Call" activity is logged on a deal. It then waits, with a goal step and no time limit, for the deal to move into the stage "Closed Won".

When that happens (the goal is met), it schedules an "Eval Follow Up" activity due 1 day after the deal's `close_date`, at 10:00, assigned round-robin across all team members.
"""

[covers]
triggers = ["activity_logged"]
steps = ["goal", "schedule_activity"]
features = ["branching"]

[[expect]]
api_name = "{p}_won_follow_up"
type = "record_based"
target_object = "eval_deals"
active = false
triggers = ["activity_logged"]
steps = { goal = 1, schedule_activity = 1 }
checks = [
  { kind = "block", step = "goal", match = { wait_type = "never", triggers = [{ trigger_type = "stage_updated" }] } },
  { kind = "branch", of = "goal", yes = ["schedule_activity"] },
  { kind = "block", step = "schedule_activity", match = { schedule = { type = "on_or_around_date" }, assigned_to = { assignment_type = "round_robin_all" } } },
]

[[rubric]]
id = "trigger"
text = '''The trigger is an "Eval Call" activity being logged.'''

[[rubric]]
id = "goal"
text = '''The goal waits, with no time limit, for a move into the stage "Closed Won".'''

[[rubric]]
id = "activity"
text = '''When the goal is met, an "Eval Follow Up" activity is scheduled due 1 day after the field close_date, at 10:00, assigned round-robin across all team members.'''
