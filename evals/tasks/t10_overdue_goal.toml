id = "t10_overdue_goal"
tier = 2
surface = "custom_object"
title = "Wait for an event with a goal step"
prompt = """
Create an automation on the `eval_tickets` object named "{p} Overdue Follow Up" with api_name `{p}_overdue_follow_up`.

It runs when a scheduled "Eval Follow Up" activity on a ticket becomes overdue. It then waits, with a goal step, for the ticket's `priority` field to be updated, for at most 2 days.

- If the priority is updated within that time (the goal is met): stop the run and mark it as Successfully Completed.
- If the 2 days pass without it: set the ticket's `escalated` checkbox to checked.
"""

[covers]
triggers = ["scheduled_activity_overdue"]
steps = ["goal", "stop_execution", "change_field_value"]
features = ["branching"]

[[expect]]
api_name = "{p}_overdue_follow_up"
type = "record_based"
target_object = "eval_tickets"
active = false
triggers = ["scheduled_activity_overdue"]
steps = { goal = 1, stop_execution = 1, change_field_value = 1 }
checks = [
  { kind = "block", step = "goal", match = { wait_type = "delay", delay_amount = 2, triggers = [{ trigger_type = "field_updated" }] } },
  { kind = "branch", of = "goal", yes = ["stop_execution"], no = ["change_field_value"] },
]

[[rubric]]
id = "trigger"
text = '''The trigger is a scheduled "Eval Follow Up" activity becoming overdue.'''

[[rubric]]
id = "goal"
text = '''The goal waits for the field priority to be updated, for at most 2 days.'''

[[rubric]]
id = "met"
text = '''When the goal is met, the run stops and is marked Successfully Completed.'''

[[rubric]]
id = "not_met"
text = '''When the time runs out, the field escalated is set to checked.'''
