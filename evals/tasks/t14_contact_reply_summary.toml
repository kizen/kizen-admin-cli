id = "t14_contact_reply_summary"
tier = 3
surface = "contacts"
title = "Email trigger, a code step into a variable, and an AI summary"
files = ["read_email.py"]
prompt = """
Create an automation on Contacts named "{p} Reply Summary" with api_name `{p}_reply_summary`.

It runs when an email is received from the contact, in any connected inbox. It uses two string variables, `email_body` and `reply_summary`.

Steps, in order:

1. A code step running the Python script in `read_email.py` (in this folder), unchanged. It has one input named `contact_email`, bound to the contact's `email` field, and one output named `email_body`, which writes the variable `email_body`.
2. An AI step using the `kizen/lite` model whose prompt is "Summarize this customer's email reply in one sentence. Reply: " followed by the value of the variable `email_body`, filled in when the step runs.
   A blank value should default to "Unknown". It writes its answer to the variable `reply_summary`.
3. Set the contact's `eval_reply_summary` field to the value of the variable `reply_summary`.
"""

[covers]
triggers = ["email_received"]
steps = ["initialize_variable", "code_step", "call_llm", "change_field_value"]
features = ["variables", "code", "ai"]

[[expect]]
api_name = "{p}_reply_summary"
type = "record_based"
target_object = "client_client"
active = false
triggers = ["email_received"]
steps = { initialize_variable = 2, code_step = 1, call_llm = 1, change_field_value = 1 }
checks = [
  { kind = "block", step = "code_step", match = { script = "*", inputs = [{ name = "contact_email" }], outputs = [{ name = "email_body" }] } },
  { kind = "block", step = "call_llm", match = { model_name = "kizen/lite", destinations = [{ variable = "reply_summary" }] } },
  { kind = "order", first = "code_step", then = "call_llm" },
  { kind = "order", first = "call_llm", then = "change_field_value" },
  { kind = "mentions", step = "call_llm", text = "automation_variable.email_body" },
]

[[rubric]]
id = "trigger"
text = '''The trigger is an email received from the contact in any connected inbox.'''

[[rubric]]
id = "code_step"
text = '''The code step's script is the provided read_email.py, unchanged, with the input contact_email bound to the field email and the output email_body writing the variable email_body.'''

[[rubric]]
id = "ai_step"
text = '''The AI step uses kizen/lite, its prompt includes a merge field that resolves to the variable email_body, a blank value defaults to "Unknown", and it writes to the variable reply_summary.'''

[[rubric]]
id = "saves_summary"
text = '''The last step sets the field eval_reply_summary from the variable reply_summary, not from fixed text.'''
