id = "t29_add_branch_to_existing"
tier = 2
surface = "contacts"
title = "Edit a condition and add a step on its other branch"
prompt = """
An automation `{p}_score_gate` already exists on Contacts. It checks whether the contact's `eval_lead_score` is 50 or more, and if so sets the contact's `eval_lifecycle` to "Engaged". Its other branch is empty.

Change it in place. Do not delete and recreate it, and do not replace its existing steps with new ones: the two steps it has now must keep their identity, so their run history stays attached.

1. Change the threshold from 50 to 75.
2. On the branch taken when the score is below the threshold, add a step that sets the contact's `eval_lifecycle` to "Dormant".
"""

[covers]
triggers = ["manual"]
steps = ["condition", "change_field_value"]
features = ["step_edit", "branching"]

[[setup]]
spec = "score_gate.json"

[[expect]]
api_name = "{p}_score_gate"
type = "record_based"
target_object = "client_client"
active = false
steps = { condition = 1, change_field_value = 2 }
checks = [
  { kind = "branch", of = "condition", yes = ["change_field_value"], no = ["change_field_value"] },
  { kind = "kept_ids" },
]

[[rubric]]
id = "threshold"
text = '''The condition now tests eval_lead_score for 75 or more.'''

[[rubric]]
id = "yes_intact"
text = '''The yes branch still sets eval_lifecycle to "Engaged".'''

[[rubric]]
id = "no_dormant"
text = '''The no branch sets eval_lifecycle to "Dormant".'''
