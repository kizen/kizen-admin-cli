id = "t19_ticket_kb_draft"
tier = 3
surface = "custom_object"
title = "AI step that calls an MCP server's tools"
requires = ["mcp_readonly"]
prompt = """
Create an automation on the `eval_tickets` object named "{p} KB Draft" with api_name `{p}_kb_draft`. It is started manually. It uses one string variable, `draft_answer`.

Steps, in order:

1. An AI step using the `kizen/pro` model that can call the tools of the MCP server `readonly`, running those tools as the service account named "Agentic Workflow Code". Its prompt is "Search the knowledge catalog for this support request, then draft a short answer. Request subject: " followed by the ticket's subject, filled in from the record.
   A blank value should default to "Unknown". It writes its answer to the variable `draft_answer`.
2. Set the ticket's `summary` field to the value of the variable `draft_answer`.
"""

[covers]
triggers = ["manual"]
steps = ["initialize_variable", "call_llm", "change_field_value"]
features = ["variables", "ai", "mcp"]

[[expect]]
api_name = "{p}_kb_draft"
type = "record_based"
target_object = "eval_tickets"
active = false
triggers = ["manual"]
steps = { initialize_variable = 1, call_llm = 1, change_field_value = 1 }
checks = [
  { kind = "block", step = "call_llm", match = { model_name = "kizen/pro", mcp_server = "readonly", run_tools_as = "Agentic Workflow Code", destinations = [{ variable = "draft_answer" }] } },
  { kind = "order", first = "call_llm", then = "change_field_value" },
  { kind = "mentions", step = "call_llm", text = "custom_objects.subject" },
]

[[rubric]]
id = "ai_step"
text = '''The AI step uses kizen/pro, with the MCP server readonly and the service account "Agentic Workflow Code".'''

[[rubric]]
id = "prompt"
text = '''Its prompt asks to search the knowledge catalog and draft a short answer, and includes a merge field that resolves to the ticket's subject. A blank value defaults to "Unknown".'''

[[rubric]]
id = "writes_variable"
text = '''It writes to the variable draft_answer.'''

[[rubric]]
id = "saves_summary"
text = '''The last step sets the field summary from the variable draft_answer, not from fixed text.'''
