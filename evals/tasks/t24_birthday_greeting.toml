id = "t24_birthday_greeting"
tier = 1
surface = "contacts"
title = "Yearly date trigger on a Contact"
prompt = """
Create an automation on Contacts named "{p} Birthday Greeting" with api_name `{p}_birthday_greeting`.

It runs on each contact's `birthday`, on the day itself, at 8:00 am, and repeats every year. It sends a text message to the contact's owner saying "Birthday today: " followed by the contact's first name (filled in from the record).
"""

[covers]
triggers = ["on_or_around_date"]
steps = ["notify_member_via_text"]

[[expect]]
api_name = "{p}_birthday_greeting"
type = "record_based"
target_object = "client_client"
active = false
triggers = ["on_or_around_date"]
steps = { notify_member_via_text = 1 }
checks = [
  { kind = "trigger_block", trigger = "on_or_around_date", match = { date_offset = "on_day", every_year = true } },
  { kind = "mentions", step = "notify_member_via_text", text = "entity_record.first_name" },
]

[[rubric]]
id = "trigger"
text = '''The trigger is the field birthday, on the day itself, at 8:00 in the morning, repeating every year.'''

[[rubric]]
id = "text"
text = '''The step texts the record's owner "Birthday today: " followed by a merge field that resolves to the contact's first name.'''
