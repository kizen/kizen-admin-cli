id = "t06_call_outcome_branch"
tier = 2
surface = "pipeline"
title = "Branch on what a logged call recorded"
prompt = """
Create an automation on the `eval_deals` pipeline named "{p} Call Outcome" with api_name `{p}_call_outcome`.

It runs when an "Eval Call" activity is logged on a deal. Then it checks the deal's `call_outcome` field:

- If it is "Left Voicemail" or "No Answer": schedule an "Eval Follow Up" activity due in 2 days, assigned to the deal's owner.
- Otherwise: set the deal's `next_step` field to "Send recap".
"""

[covers]
triggers = ["activity_logged"]
steps = ["condition", "schedule_activity", "change_field_value"]
features = ["branching"]

[[expect]]
api_name = "{p}_call_outcome"
type = "record_based"
target_object = "eval_deals"
active = false
triggers = ["activity_logged"]
steps = { condition = 1, schedule_activity = 1, change_field_value = 1 }
checks = [
  { kind = "block", step = "condition", match = { type = "custom_filter" } },
  { kind = "branch", of = "condition", yes = ["schedule_activity"], no = ["change_field_value"] },
]

[[rubric]]
id = "trigger_eval_call"
text = '''The trigger is an "Eval Call" activity being logged.'''

[[rubric]]
id = "condition_values"
text = '''The condition tests the field call_outcome for exactly the two options "Left Voicemail" and "No Answer".'''

[[rubric]]
id = "yes_branch"
text = '''The yes branch schedules an "Eval Follow Up" activity due in 2 days, assigned to the record's owner.'''

[[rubric]]
id = "no_branch"
text = '''The no branch sets the field next_step to "Send recap".'''
