id = "t05_lost_deal_archive"
tier = 1
surface = "pipeline"
title = "Archive a lost deal after 30 days"
prompt = """
Create an automation on the `eval_deals` pipeline named "{p} Lost Deal Archive" with api_name `{p}_lost_deal_archive`.

When a deal moves into the stage "Closed Lost", wait 30 days, then archive the deal record itself.
"""

[covers]
triggers = ["stage_updated"]
steps = ["delay", "archive_record"]

[[expect]]
api_name = "{p}_lost_deal_archive"
type = "record_based"
target_object = "eval_deals"
active = false
triggers = ["stage_updated"]
steps = { delay = 1, archive_record = 1 }
checks = [
  { kind = "block", step = "delay", match = { days = 30 } },
  { kind = "block", step = "archive_record", match = { record_source = "this_record" } },
  { kind = "order", first = "delay", then = "archive_record" },
]

[[rubric]]
id = "stage_closed_lost"
text = '''The trigger fires on a move into the stage "Closed Lost".'''

[[rubric]]
id = "waits_thirty_days"
text = '''The wait is exactly 30 days.'''

[[rubric]]
id = "archives_this_deal"
text = '''The archive step archives the triggering deal itself, not a related record.'''
