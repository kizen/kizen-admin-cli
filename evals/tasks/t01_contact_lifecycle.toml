id = "t01_contact_lifecycle"
tier = 1
surface = "contacts"
title = "Set a field when a contact is created"
prompt = """
Create an automation on Contacts named "{p} Contact Lifecycle" with api_name `{p}_contact_lifecycle`.

When a new contact is created (on creation only, not on later updates), set the contact's `eval_lifecycle` field to "New".
"""

[covers]
triggers = ["new_entity_created"]
steps = ["change_field_value"]

[[expect]]
api_name = "{p}_contact_lifecycle"
type = "record_based"
target_object = "client_client"
active = false
triggers = ["new_entity_created"]
steps = { change_field_value = 1 }
checks = [
  { kind = "trigger_block", trigger = "new_entity_created", match = { action = "create_only" } },
]

[[rubric]]
id = "fires_on_create_only"
text = '''The trigger fires when a contact is created, and not on later updates.'''

[[rubric]]
id = "sets_lifecycle_new"
text = '''The one action step sets the Contacts field eval_lifecycle to the option "New".'''
