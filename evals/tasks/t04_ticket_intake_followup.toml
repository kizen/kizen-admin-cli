id = "t04_ticket_intake_followup"
tier = 1
surface = "custom_object"
title = "Schedule a follow-up when a form is submitted"
prompt = """
Create an automation on the `eval_tickets` object named "{p} Intake Follow Up" with api_name `{p}_intake_follow_up`.

When the form "Eval Ticket Intake" is submitted, schedule an "Eval Follow Up" activity due 1 day later, assigned to the ticket's owner, with the note:

New ticket from the intake form: {{ custom_objects.subject }}
"""

[covers]
triggers = ["form_submitted"]
steps = ["schedule_activity"]

[[expect]]
api_name = "{p}_intake_follow_up"
type = "record_based"
target_object = "eval_tickets"
active = false
triggers = ["form_submitted"]
steps = { schedule_activity = 1 }
checks = [
  { kind = "block", step = "schedule_activity", match = { schedule = { type = "with_delay" } } },
]
