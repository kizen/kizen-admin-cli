id = "t27_contract_extraction"
tier = 3
surface = "pipeline"
title = "File extraction that reads a related record's file"
prompt = """
Create an automation on the `eval_deals` pipeline named "{p} Contract Terms" with api_name `{p}_contract_terms`. It is started manually.

Steps, in order:

1. A file content extraction step using the `kizen/lite` model. The file it reads is not on the deal: it is the `contract` file field of the account the deal is related to through its `account` relationship field. Its prompt is "Summarize the key commercial terms of this contract in three bullet points." It writes the result to the deal's `ai_brief` field.
2. Set the deal's `next_step` field to "Review contract summary".
"""

[covers]
triggers = ["manual"]
steps = ["file_content_extraction", "change_field_value"]
features = ["ai", "related_records"]

[[expect]]
api_name = "{p}_contract_terms"
type = "record_based"
target_object = "eval_deals"
active = false
triggers = ["manual"]
steps = { file_content_extraction = 1, change_field_value = 1 }
checks = [
  { kind = "block", step = "file_content_extraction", match = { model_name = "kizen/lite", input_value_source = { type = "related_object_field" }, destinations = "*" } },
  { kind = "order", first = "file_content_extraction", then = "change_field_value" },
]

[[rubric]]
id = "reads_related_file"
text = '''The extraction step reads the contract field of the account reached through the deal's account relationship field, not a field on the deal.'''

[[rubric]]
id = "prompt_and_destination"
text = '''It uses kizen/lite with the prompt "Summarize the key commercial terms of this contract in three bullet points." and writes to the deal's ai_brief field.'''

[[rubric]]
id = "next_step"
text = '''The step after it sets next_step to "Review contract summary".'''
